    <polygon points="0,-28 6.5,-10 25,-10 11,2 16,20 0,8 -16,20 -11,2 -25,-10 -6.5,-10" fill="#DAA520"/>
  </g>
  <!-- Star 2 (Indigo Blue, offset to create "twin" effect) -->
